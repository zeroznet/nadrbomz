# scripted/written by Robert Bopko (github.com/zeroznet) with Boba Bott (Claude Opus 5.5)

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-26.04
    steps:
      # Major tag instead of a SHA pin: no dependency bot runs on this repo,
      # and the job only reads the checkout and holds no secrets.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install zsh and shellcheck
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q zsh shellcheck

      - name: shellcheck
        run: |
          set -eu
          shellcheck -s sh nadrbomz.sh ssh-key-ensure_zero wt-connect_zero claude/scripts/prune.sh
          shellcheck -s bash claude/statusline-command.sh

      # The rc files are sourced, not run, and lean on host-specific branches
      # and dynamic sources shellcheck cannot follow, so parsing them is the gate.
      - name: Config syntax
        run: |
          set -eu
          zsh -n zshrc_zero
          zsh -n zshenv_zero
          zsh -n shell_aliases_zero
          bash -n bashrc_zero
          bash -n shell_aliases_zero
          jq empty claude/settings.json

      - name: Banner matches the intro
        run: |
          set -eu
          python3 assets/render-cracktro.py
          if ! git diff --exit-code -- assets/cracktro.svg; then
            echo "::error::assets/cracktro.svg is stale; run python3 assets/render-cracktro.py and commit it"
            exit 1
          fi

      # Two full runs into an empty HOME from this checkout: the first deploys
      # everything, the second proves a rerun is clean and backs up each target.
      # No claude CLI on the runner, so the plugin section reports a skip.
      - name: Bootstrap smoke run
        run: |
          set -eu
          home="${RUNNER_TEMP}/home"
          mkdir -p "${home}"
          for pass in 1 2; do
            log="${RUNNER_TEMP}/run-${pass}.log"
            if ! HOME="${home}" NADRBOMZ_CLONE_URL="file://${GITHUB_WORKSPACE}" sh nadrbomz.sh >"${log}" 2>&1; then
              cat "${log}"
              echo "::error::nadrbomz.sh failed on pass ${pass}"
              exit 1
            fi
            cat "${log}"
            if ! grep -q 'WARNINGS \.\.\.\.\.\. 0$' "${log}"; then
              echo "::error::pass ${pass} reported warnings"
              exit 1
            fi
          done
          for target in .zshrc .zshenv .bashrc .shell_aliases .screenrc .tmux.conf \
            .config/nvim/init.vim .config/fastfetch/config.jsonc .ssh/config \
            .claude/settings.json .claude/statusline-command.sh .claude/scripts/prune.sh \
            dev/CLAUDE.md dev/HOWTO.md .oh-my-zsh/oh-my-zsh.sh; do
            if [ ! -s "${home}/${target}" ]; then
              echo "::error::missing after bootstrap: ~/${target}"
              exit 1
            fi
          done
          if [ ! -f "${home}/.zshrc.bak" ]; then
            echo "::error::second pass did not back up ~/.zshrc"
            exit 1
          fi
